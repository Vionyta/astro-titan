services:
  # Production Frontend (Astro SSG on Nginx)
  victorong_v23_prod:
    build:
      context: .
      target: runner
      dockerfile: Dockerfile
    container_name: victorong_v23_prod
    environment:
      - NODE_ENV=production
    networks:
      default:
        aliases:
          - frontend
    expose:
      - "4321"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    profiles:
      - prod
    restart: unless-stopped

  # Reverse Proxy (Production)
  victorong_v23_prod_proxy:
    image: nginx:1.27.4-alpine3.21
    container_name: victorong_v23_prod_proxy
    ports:
      - "4321:4321"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-prod:
        condition: service_healthy
    networks:
      default:
        aliases:
          - proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles:
      - prod
    restart: unless-stopped

  # Development Frontend (Node + pnpm dev with hot reload)
  victorong_v23_dev:
    image: node:22.12.0-alpine3.21
    container_name: victorong_v23_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_USE_POLLING=true
      - HOST=0.0.0.0
      - PORT=4321
    expose:
      - "4321"
    command: >
      sh -c "
      npm install -g pnpm@10.33.0 &&
      pnpm config set --global update-notifier false &&
      pnpm install --frozen-lockfile &&
      pnpm run astro dev
      "
    networks:
      default:
        aliases:
          - localhost
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 120s
    profiles:
      - dev
    restart: unless-stopped

  # Reverse Proxy (Development)
  victorong_v23_dev_proxy:
    image: nginx:1.27.4-alpine3.21
    container_name: victorong_v23_dev_proxy
    ports:
      - "4321:4321"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      victorong_v23_dev:
        condition: service_healthy
    networks:
      default:
        aliases:
          - localhost
    healthcheck:
      test: ["CMD", "wget", "--tries=10", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 120s
    profiles:
      - dev
    restart: unless-stopped

networks:
  default:
    name: titan_network
    driver: bridge
