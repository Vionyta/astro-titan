services:
  # Production Frontend (Astro SSG on Nginx)
  frontend-prod:
    build:
      context: .
      target: runner
      dockerfile: Dockerfile
    container_name: titan_prod
    environment:
      - NODE_ENV=production
    networks:
      default:
        aliases:
          - frontend
    expose:
      - "4321"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    profiles:
      - prod
    restart: unless-stopped

  # Reverse Proxy (Production)
  proxy:
    image: nginx:1.27.4-alpine3.21
    container_name: titan_proxy
    ports:
      - "4321:4321"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-prod:
        condition: service_healthy
    networks:
      default:
        aliases:
          - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles:
      - prod
    restart: unless-stopped

  # Development Frontend (Node + pnpm dev with hot reload)
  frontend-dev:
    image: node:22.12.0-alpine3.21
    container_name: titan_dev
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./astro.config.mjs:/app/astro.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./package.json:/app/package.json
      - /app/node_modules
      - /app/.astro
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_USE_POLLING=true
      - HOST=0.0.0.0
      - PORT=4321
    ports:
      - "4321:4321"
    command: >
      sh -c "
      npm install -g pnpm@10.33.0 &&
      pnpm config set --global update-notifier false &&
      pnpm install &&
      pnpm dev --host 0.0.0.0 --port 4321
      "
    networks:
      default:
        aliases:
          - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles:
      - dev
    restart: unless-stopped

  # Reverse Proxy (Development)
  proxy-dev:
    image: nginx:1.27.4-alpine3.21
    container_name: titan_proxy_dev
    ports:
      - "4321:4321"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-dev:
        condition: service_healthy
    networks:
      default:
        aliases:
          - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles:
      - dev
    restart: unless-stopped

networks:
  default:
    name: titan_network
    driver: bridge
