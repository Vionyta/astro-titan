services:
  # The Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: titan_proxy
    ports:
      - "4321:4321"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-prod
    profiles:
      - prod
    
  proxy-dev:
    image: nginx:alpine
    container_name: titan_proxy_dev
    ports:
      - "4321:4321"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-dev
    profiles:
      - dev

  # Production Frontend (Astro SSG on Nginx)
  frontend-prod:
    build:
      context: .
      target: runner
    container_name: titan_prod
    networks:
      default:
        aliases:
          - frontend
    expose:
      - "4321"
    profiles:
      - prod

  # Development Frontend (Node + pnpm dev)
  frontend-dev:
    image: node:22-alpine
    container_name: titan_dev
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.astro
    networks:
      default:
        aliases:
          - frontend
    environment:
      # Enable polling for Hyper-V on Windows 11 to ensure HMR
      - CHOKIDAR_USEPOLLING=true
      - VITE_USE_POLLING=true
      - HOST=0.0.0.0
      - PORT=4321
    command: >
      sh -c "
      npm install -g pnpm@10.33.0 &&
      pnpm config set --global update-notifier false &&
      pnpm install && 
      pnpm dev --host 0.0.0.0 --port 4321
      "
    expose:
      - "4321"
    profiles:
      - dev
