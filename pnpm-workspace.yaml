packages:
  - packages/**/*
  - packages/astro/test/units/_temp-fixtures
  - examples/**/*
  - triage/*
  - smoke/**/*
  - temp/*
  - scripts
  - benchmark
  - benchmark/packages/*
  - benchmark/static-projects/*
  - '!packages/astro/test/units/_temp-fixtures/*'
  - '!**/.vercel/**'

autoInstallPeers: true

linkWorkspacePackages: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:

onlyBuiltDependencies:
  - esbuild
  - workerd
  - '@biomejs/biome'
  - sharp
  - '@parcel/watcher'
  - keytar
  - '@vscode/vsce-sign'

overrides:
  defu@<=6.1.4: '>=6.1.5'
  vite@<=6.4.1: '>=6.4.2'
  vite@>=6.0.0 <=6.4.1: '>=6.4.2'
  vite@>=7.0.0 <=7.3.1: '>=7.3.2'
  vite@>=7.1.0 <=7.3.1: '>=7.3.2'
  vite@>=8.0.0 <=8.0.4: '>=8.0.5'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'

peerDependencyRules:
  allowAny:
    - astro
    - vite

preferWorkspacePackages: true

saveWorkspaceProtocol: false
